name: Build Htet Thu Ya APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore signing keystore and Firebase config
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
            else
              echo "ERROR: Missing DEBUG_KEYSTORE_BASE64 GitHub Actions secret."
              exit 1
            fi
          fi

          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              TRIMMED="$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed 's/^[[:space:]]*//')"
              case "$TRIMMED" in
                \{*)
                  printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
                  ;;
                *)
                  printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | base64 -d > app/google-services.json
                  ;;
              esac
            else
              echo "ERROR: Missing GOOGLE_SERVICES_JSON GitHub Actions secret."
              exit 1
            fi
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK and licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a\n" > "$SDK_DIR/licenses/intel-android-extra-license"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          elif [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LoTaYa.apk
          cp app/build/outputs/apk/debug/app-debug.apk HtetThuYa.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoTaYa-APK
          path: LoTaYa.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "Lo Ta Ya (လိုတရ) APK" \
              --notes "Direct Android APK download for Lo Ta Ya (Customer & Admin)." \
              --latest
          fi

          RELEASE_ID="$(gh release view latest --json databaseId --jq '.databaseId')"

          delete_existing_asset() {
            local file="$1"
            local asset_id
            for asset_id in $(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq ".[] | select(.name == \"${file}\") | .id" 2>/dev/null || true); do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >/dev/null 2>&1 || true
            done
          }

          upload_asset() {
            local file="$1"
            local attempt
            for attempt in 1 2 3 4; do
              echo "Uploading ${file} (attempt ${attempt}/4)..."
              if [ "$attempt" -eq 1 ]; then
                if gh release upload latest "$file" --clobber; then
                  echo "Uploaded ${file} via gh CLI."
                  return 0
                fi
              else
                delete_existing_asset "$file"
                if curl --http1.1 --fail --show-error --silent \
                  --connect-timeout 30 --max-time 300 \
                  --speed-time 30 --speed-limit 1024 \
                  -X POST \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  -H "Content-Type: application/vnd.android.package-archive" \
                  --data-binary "@${file}" \
                  "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${file}" >/dev/null; then
                  echo "Uploaded ${file} via curl HTTP/1.1."
                  return 0
                fi
              fi

              echo "Upload attempt ${attempt} failed for ${file}; waiting before retry..."
              sleep $((attempt * 5))
            done

            echo "ERROR: Failed to upload ${file} after 4 attempts."
            return 1
          }

          upload_asset "LoTaYa.apk"
          upload_asset "HtetThuYa.apk"
