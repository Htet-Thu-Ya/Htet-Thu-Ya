name: Build Htet Thu Ya APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk HtetThuYa.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HtetThuYa-APK
          path: HtetThuYa.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest HtetThuYa.apk --clobber
          else
            gh release create latest HtetThuYa.apk \
              --title "Htet Thu Ya APK" \
              --notes "Direct Android APK download for Htet Thu Ya (Customer & Admin)." \
              --latest
          fi
